[project]
name = "angle-editor-agent"
version = "0.1.0"
description = "A human-approved editorial agent for original psychology-informed perspectives."
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.6"]

[project.scripts]
angle-agent = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "publisher"]
